<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Dog Is For You?</title>
  <link href="dogs.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="dog.js"></script>
 

</head>
<body>


<div>
    <img src = "https://t3.ftcdn.net/jpg/03/15/33/46/360_F_315334660_S7hD3wMVnn9EtVvvmkNRedP8buaJDbNV.jpg" 
        class = "w-full md:h-[210px] sm:-h[130px]"/>
</div>
    

<div class = "mt-[35px]">
    <h1 class = "w-fit mx-auto 
        text-center text-white text-[5vw] font-bold
        border-solid outline-[#FFC30B] outline-[8px] bg-black p-[15px]">
        Survey Complete!</h1>    
</div>


<div class = "mt-[20px] md:mt-[90px] mx-auto">

    <ul class = "flex justify-self-center">
        <li class = "z-1">
            <img src = "https://i.pinimg.com/474x/73/4c/cf/734ccfc60c206943fadc1ae2a71c49f9.jpg" 
                 class= "w-[25vw] h-[25vw] ml-[60px] border-solid rounded-full outline-[#FFC30B] outline-[5px]  ">  
        </li>

        <li class = "z-2">
            <img src = "https://t4.ftcdn.net/jpg/00/54/47/79/360_F_54477960_af1EVdNrTXUpoVeD2fyieHrkJm5R177R.jpg" 
                 class= "w-[30vw] h-[30vw] border-solid rounded-full outline-[#FFC30B] outline-[5px]">  
        </li>

         <li class = "z-1">
            <img src = "https://www.shutterstock.com/image-photo/man-beard-his-small-yellow-600nw-419511310.jpg" 
                 class= "w-[25vw] h-[25vw] mr-[60px] border-solid rounded-full outline-[#FFC30B] outline-[5px] ">  
        </li>
        
    </ul>
    
</div>

    
<div class = "mt-[20px] md:mt-[60px]">
    
    <h4 class = "w-fit mx-auto 
        text-center text-white text-[3.6vw] font-bold
        border-solid rounded-3xl outline-[#FFC30B] outline-[5px] bg-black p-[7px]">
        Your Results Are Shown Below.</h4>   
    
</div>

<div class = "mt-[15px] md:mt-[40px] ml-[11vw] mr-[11vw]">
    
    <p class = "text-center text-black/75 text-[1.6vw] text-justify">Thank you for your time! You're on the right path to finding your new dog. Click on each suggested dog to learn more information.</p>
    
</div>

    
<div class = " mt-[90px] w-fit mx-auto
        text-center text-white text-[4.5vw] font-bold
        border-solid outline-[#FFC30B] outline-[8px] bg-black p-[25px]">
        
        <div id = "0" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "1" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "2" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "3" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "4" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "5" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "6" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "7" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "8" class="underline hover:text-[#FFC30B]"></div>
        <hr class = "text-[#FFC30B] outline-[.5vw] outline-dotted"/>
    
        <div id = "9" class="underline hover:text-[#FFC30B]"></div>
    
</div>


<footer class="bg-black text-center py-[5vh] mt-25">
  <p class="text-sm text-white"></p>
    <img src = "https://icons.veryicon.com/png/o/miscellaneous/home-objects-misc/dog-food.png" class= "flex justify-self-center w-[3vw] h-[3vw]">  
</footer>

</html>
